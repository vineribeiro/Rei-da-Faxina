<title>Rei da Faxina</title>
<style>
/* Layout: sidebar + conteúdo no desktop, barra inferior no celular. Visual cartoon com contorno grosso e sombra dura. */
:root{
  --bg:#EDF2FB; --surface:#FFFFFF; --surface2:#F3F6FC; --fg:#1B2340; --muted:#566080; --line:#1B2340;
  --yellow:#FFC93C; --blue:#2B63E8; --green:#17A06A; --orange:#F2761F; --red:#D93A40;
  --yellow-s:#FFF0BD; --blue-s:#DCE7FF; --green-s:#D3F4E4; --orange-s:#FFE2CC; --red-s:#FFDEDF;
  --on-blue:#FFFFFF; --on-yellow:#1B2340; --on-green:#FFFFFF; --on-red:#FFFFFF;
  --font-d:'Fredoka',ui-rounded,system-ui,sans-serif; --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --sh:0 4px 0 var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11162A; --surface:#1C2445; --surface2:#242E58; --fg:#EEF1FF; --muted:#A9B2D6; --line:#050711;
  --blue:#6B9BFF; --green:#38D39A; --orange:#FF9A55; --red:#FF6B70;
  --yellow-s:#4A3C10; --blue-s:#26356E; --green-s:#17493C; --orange-s:#573418; --red-s:#5A2429;
  --on-blue:#0B1230; --on-green:#07251B; --on-red:#2A0709; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11162A; --surface:#1C2445; --surface2:#242E58; --fg:#EEF1FF; --muted:#A9B2D6; --line:#050711;
  --blue:#6B9BFF; --green:#38D39A; --orange:#FF9A55; --red:#FF6B70;
  --yellow-s:#4A3C10; --blue-s:#26356E; --green-s:#17493C; --orange-s:#573418; --red-s:#5A2429;
  --on-blue:#0B1230; --on-green:#07251B; --on-red:#2A0709; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:600 15px/1.45 var(--font-b);padding-inline:16px}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}h4{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:1fr;gap:16px;max-width:1180px;margin:0 auto;padding-block:14px 96px}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media(min-width:900px){
  body{padding-inline:24px}
  .app{grid-template-columns:230px 1fr;padding-block:22px 40px;align-items:start}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);padding-top:4px}
  .bottom{display:none!important}
}
.brand{font:700 24px var(--font-d);display:flex;gap:10px;align-items:center;margin-bottom:10px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--yellow);border:3px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;font-size:22px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:3px solid transparent;background:none;cursor:pointer;font:600 16px var(--font-d);text-align:left;color:var(--fg)}
.nav svg{width:22px;height:22px;flex:none}
.nav:hover{background:var(--surface)}
.nav[aria-current="page"]{background:var(--yellow);color:var(--on-yellow);border-color:var(--line);box-shadow:var(--sh)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;font:600 11px var(--font-d);color:var(--muted);cursor:pointer;border-radius:12px;min-height:48px}
.bottom button svg{width:24px;height:24px}
.bottom button[aria-current="page"]{color:var(--fg);background:var(--yellow-s)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top .t{min-width:0}
.top small{color:var(--muted);font-weight:700;display:block}
.me{display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.grid.stats .card{padding:12px 14px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.big{font:700 34px/1 var(--font-d);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:14px;border:3px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font:600 16px var(--font-d);cursor:pointer;transition:transform .08s,box-shadow .08s;color:var(--fg)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.green{background:var(--green);color:var(--on-green)}
.btn.danger{background:var(--red);color:var(--on-red)}
.btn.ghost{box-shadow:none;border-color:var(--line);background:transparent}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;border:2px solid var(--line);font:700 12px var(--font-b);background:var(--surface2);white-space:nowrap}
.pill.available{background:var(--blue-s)}.pill.in_progress{background:var(--yellow-s)}
.pill.awaiting_approval,.pill.awaiting_proof{background:var(--orange-s)}.pill.done{background:var(--green-s)}
.pill.rejected,.pill.late{background:var(--red-s)}.pill.cancelled{background:var(--surface2);color:var(--muted)}
.pill.pts{background:var(--yellow);color:var(--on-yellow)}
.av{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none;background:var(--surface2)}
.av.sm{width:30px;height:30px;font-size:16px;border-width:2px}
.av.lg{width:72px;height:72px;font-size:40px}
.bar{height:16px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.rank{display:grid;grid-template-columns:34px 44px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.rank + .rank{border-top:2px dashed var(--surface2)}
.pos{font:700 22px var(--font-d);text-align:center;font-variant-numeric:tabular-nums}
.crown{display:inline-block;width:18px;height:14px;vertical-align:-1px}
.task{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.task .ic{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--yellow-s);display:grid;place-items:center;font-size:24px}
.task h4{margin-bottom:4px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:13px}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:3px solid var(--line);background:var(--surface);font-weight:600}
textarea.in{min-height:84px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:99px;border:3px solid var(--line);background:var(--surface);font:600 15px var(--font-d);cursor:pointer;color:var(--fg)}
.tab[aria-selected="true"]{background:var(--blue);color:var(--on-blue)}
.ov{position:fixed;inset:0;background:rgba(5,7,17,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet{background:var(--bg);border:3px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@media(min-width:700px){.ov{align-items:center;padding:20px}.sheet{border-bottom:3px solid var(--line);border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;background:var(--surface);border:3px solid var(--line);box-shadow:var(--sh);border-radius:14px;padding:10px 16px;font:600 15px var(--font-d);max-width:480px;animation:up .2s}
.toast.ok{background:var(--green-s)}.toast.err{background:var(--red-s)}.toast.star{background:var(--yellow-s)}
.banner{border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--yellow-s);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.red{background:var(--red-s)}.banner.blue{background:var(--blue-s)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .big-e{font-size:46px;margin-bottom:6px}
.proof{width:100%;max-height:340px;object-fit:contain;border-radius:12px;border:3px solid var(--line);background:var(--surface2)}
.drop{display:flex;gap:10px;flex-wrap:wrap}
.ach{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.ach .ic{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:28px;background:var(--yellow)}
.ach.lock .ic{background:var(--surface2);filter:grayscale(1);opacity:.7}
.wheelbox{display:grid;place-items:center;position:relative;padding:8px 0}
.wheel{width:min(86vw,340px);aspect-ratio:1;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--red);filter:drop-shadow(0 2px 0 var(--line));z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:2px solid var(--surface2);white-space:nowrap}
.tbl th{font-family:var(--font-d);font-weight:600}
.scroll{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.ev{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--surface2)}
.ev:first-child{border-top:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--yellow);box-shadow:var(--sh)}
.picker.cols button{border-radius:12px}
.picker.cols button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:10px;border-radius:99px;border:2px solid var(--line);background:var(--surface)}
.steps i.on{background:var(--yellow)}
.login{max-width:520px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px;align-items:stretch;padding-bottom:40px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.who button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:var(--r);border:3px solid var(--line);background:var(--surface);box-shadow:var(--sh);cursor:pointer;font:600 18px var(--font-d);color:var(--fg)}
.who button:hover{transform:translateY(-2px)}
.pinin{text-align:center;letter-spacing:.5em;font:700 28px var(--font-d)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:4px solid}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style id="pixel">
/* ===== Tema 8 bits: paleta de console, bordas retas, sombras duras, fonte pixelada ===== */
:root:root:root{
  --bg:#0A1226; --surface:#111D3C; --surface2:#1B2C58; --fg:#EAF0FA; --muted:#9FB0D6; --line:#030712;
  --yellow:#FFC21A; --blue:#2AA3EE; --green:#39E06E; --orange:#F26A1B; --red:#E0323B;
  --yellow-s:#4A3A0C; --blue-s:#143A6B; --green-s:#14502E; --orange-s:#5A2D10; --red-s:#5A1A22;
  --on-blue:#030712; --on-yellow:#030712; --on-green:#030712; --on-red:#030712;
  --font-d:'Press Start 2P','Courier New',monospace; --font-b:'VT323','Courier New',monospace;
  --r:0px; --sh:4px 4px 0 var(--line); color-scheme:dark}
html{image-rendering:pixelated}
body{font:400 21px/1.15 var(--font-b);letter-spacing:.01em;background-color:var(--bg);
  background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:32px 32px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
h1,h2,h3,h4{font-weight:400;line-height:1.4;text-shadow:2px 2px 0 var(--line)}
h1{font-size:17px;color:var(--yellow)}h2{font-size:14px}h3{font-size:12px}h4{font-size:11px}
.big{font:400 24px/1 var(--font-d);text-shadow:3px 3px 0 var(--line)}
.sm{font-size:18px}.muted{color:var(--muted)}
.brand{font:400 14px/1.3 var(--font-d);text-shadow:2px 2px 0 var(--line)}
.logo{background:#08102A url(icons/icon-192.png) center/cover no-repeat;font-size:0;border-radius:0;border-width:4px;width:46px;height:46px}
.card,.btn,.in,select.in,textarea.in,.tab,.pill,.av,.toast,.banner,.sheet,.proof,.task .ic,.ach .ic,.bar,.bar i,.picker button,.who button,.nav,.bottom button,.steps i,.drop label{border-radius:0!important}
.card,.banner,.toast{border-width:4px;box-shadow:4px 4px 0 var(--line)}
.card{background:var(--surface)}
.nav{font:400 11px/1.3 var(--font-d);border-width:4px;padding:12px 12px}
.nav[aria-current="page"]{background:var(--yellow);box-shadow:4px 4px 0 var(--line)}
.nav:hover{background:var(--surface2)}
.bottom{border-top:4px solid var(--line)}
.bottom button{font:400 8px/1.3 var(--font-d);color:var(--muted)}
.bottom button[aria-current="page"]{color:var(--yellow);background:var(--surface2)}
.btn{font:400 11px/1.3 var(--font-d);border-width:4px;box-shadow:0 4px 0 var(--line);min-height:46px;padding:8px 14px;text-transform:uppercase;letter-spacing:0}
.btn.sm{font-size:9px;min-height:40px;padding:4px 10px}
.btn:hover{transform:none;filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--fg)}
.tab{font:400 10px/1.3 var(--font-d);border-width:4px;padding:9px 11px;background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--yellow);color:var(--on-yellow)}
.pill{font:400 17px/1 var(--font-b);border-width:3px;padding:2px 8px}
.pill.pts{background:var(--yellow);color:var(--on-yellow)}
.pill.lv{background:var(--green);color:var(--on-green);font:400 9px/1.4 var(--font-d);padding:4px 6px}
.av{border-width:4px;background:var(--surface2)!important}
.av.sm{border-width:3px}
.in,select.in,textarea.in{border-width:4px;background:#0F0A26;color:var(--fg);font:400 21px var(--font-b)}
.in:focus{outline:4px solid var(--yellow);outline-offset:0}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;border-radius:0}
label.f{font:400 9px/1.5 var(--font-d);text-transform:uppercase;color:var(--muted)}
label.f .in,label.f select{font-size:21px;text-transform:none}
.chk{font:400 21px var(--font-b)}.chk input{accent-color:var(--green);border-radius:0}
.stat .lbl{font:400 9px/1.4 var(--font-d);letter-spacing:0}
.bar{height:20px;border-width:4px;background:#0F0A26;position:relative}
.bar i{border-radius:0;transition:width .4s steps(10)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(5,3,18,.55) 6px 8px);pointer-events:none}
.rank{grid-template-columns:40px 44px 1fr auto}
.pos{font:400 14px var(--font-d)}
.rank + .rank,.ev,.ev:first-child{border-top:3px dotted var(--surface2)}
.task .ic,.ach .ic{border-width:4px;background:var(--surface2)}
.ach .ic{background:var(--yellow)}
.meta{font:400 18px var(--font-b);color:var(--muted)}
.ov{background:rgba(5,3,18,.75)}
.sheet{border-width:4px;border-bottom:0;background:var(--surface)}
@media(min-width:700px){.sheet{border-bottom:4px solid var(--line)}}
.toast{font:400 10px/1.6 var(--font-d);animation:up .2s steps(4)}
.pointer{border-top-color:var(--yellow)}
.banner{background:var(--yellow-s)}.banner.red{background:var(--red-s)}.banner.blue{background:var(--blue-s)}
.empty .big-e{filter:none;image-rendering:pixelated}
.tbl th{font:400 9px var(--font-d)}
.proof{border-width:4px;image-rendering:auto}
.pop{animation:pop .4s steps(5)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.steps i{border-width:3px;height:12px}
.who button{font:400 12px var(--font-d);border-width:4px}
.picker button{border-width:4px}
.pinin{font:400 22px var(--font-d)}
.top small{font:400 18px var(--font-b);color:var(--muted)}
.pickg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pickg h4{color:var(--yellow)}
.pickrow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:6px 0;border-top:3px dotted var(--surface2)}
.pickrow .in{min-height:40px;padding:4px 8px;text-align:center}
.pickrow .chk{min-width:0}.pickrow .chk span{overflow-wrap:anywhere}
.mute{min-width:46px}
.card[style*="var(--yellow)"] h2{text-shadow:none}
.hero{width:min(100%,640px);height:auto;display:block;image-rendering:auto;border:4px solid var(--line);box-shadow:6px 6px 0 var(--line)}
.fs{font:400 9px/1.5 var(--font-d);text-transform:uppercase;color:var(--muted)}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:6px}

<script>
'use strict';
/* Modo Supabase: ligado quando config.js traz url e anonKey. Sem isso, o app funciona só neste aparelho (modo local). */
const CFG=window.SUPABASE_CONFIG||{};
const WANT_REMOTE=!!(CFG.url&&CFG.anonKey);
const REMOTE=WANT_REMOTE&&!!window.supabase;
/* ===== utilidades ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let clock=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(clock());
const nowIso=()=>clock().toISOString();
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmtD(pd(s))===s;
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmtD(d)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const addMonth=(s,anchor)=>{const d=pd(s);let y=d.getFullYear(),m=d.getMonth()+2;if(m>12){m-=12;y++}return y+'-'+pad(m)+'-'+pad(Math.min(anchor,dim(y,m)))};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const monthEnd=s=>{const d=pd(s);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(dim(d.getFullYear(),d.getMonth()+1))};
const brDate=s=>s?s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const brShort=s=>s.slice(8)+'/'+s.slice(5,7);
const dayOf=iso=>fmtD(new Date(iso));
const brTime=iso=>{const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const periodLabel=p=>{const d=pd(p.start);return MESES[d.getMonth()]+' de '+d.getFullYear()};
const normT=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function randInt(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}

/* ===== camada de dados (adapter). Para o Supabase, troque este objeto e as funções de A.* por chamadas RPC ===== */
const Adapter={
  key:'casa-em-jogo:v1',volatile:false,mem:new Map(),db:null,
  load(){try{const r=localStorage.getItem(this.key);return r?JSON.parse(r):null}catch(e){this.volatile=true;return null}},
  save(s){try{localStorage.setItem(this.key,JSON.stringify(s));this.volatile=false}catch(e){this.volatile=true}},
  clear(){try{localStorage.removeItem(this.key)}catch(e){}},
  idb(){if(this.db)return this.db;this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('casa-em-jogo-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
  async putPhoto(id,data){this.mem.set(id,data);try{const d=await this.idb();await new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){this.photoVolatile=true}},
  async getPhoto(id){if(this.mem.has(id))return this.mem.get(id);try{const d=await this.idb();return await new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>{if(q.result)this.mem.set(id,q.result);res(q.result||null)};q.onerror=()=>rej(q.error)})}catch(e){return null}}
};

/* ===== dados iniciais ===== */
const CATS=[['cozinha','Cozinha','🍳'],['banheiro','Banheiro','🚿'],['quarto','Quarto','🛏️'],['sala','Sala','🛋️'],['lavanderia','Lavanderia','🧺'],['organizacao','Organização','🗂️'],['limpeza','Limpeza geral','🧽'],['animais','Cuidados com animais','🐈'],['outras','Outras tarefas','✨']];
const CATALOG=[['Arrumar a cama',5,'quarto','daily'],['Lavar a louça',10,'cozinha','daily'],['Limpar a bancada e o fogão',5,'cozinha','daily'],['Tirar o lixo',5,'cozinha','daily'],['Varrer a cozinha',8,'cozinha','daily'],['Dar comida e água aos pets',5,'animais','daily'],['Limpar a caixa de areia dos gatos',8,'animais','daily'],['Recolher o que está fora do lugar',5,'sala','daily'],['Varrer e passar pano na casa',20,'limpeza','weekly'],['Passar aspirador',15,'limpeza','weekly'],['Limpar o banheiro',25,'banheiro','weekly'],['Trocar a roupa de cama',15,'quarto','weekly'],['Lavar roupas',15,'lavanderia','weekly'],['Estender ou recolher roupas',10,'lavanderia','weekly'],['Dobrar e guardar roupas',10,'lavanderia','weekly'],['Passar roupas',15,'lavanderia','weekly'],['Organizar a sala',10,'sala','weekly'],['Limpar espelhos e vidros',10,'limpeza','weekly'],['Regar as plantas',10,'outras','weekly'],['Levar o lixo reciclável',10,'outras','weekly'],['Fazer as compras da casa',25,'outras','weekly'],['Limpar o box e o rejunte',35,'banheiro','biweekly'],['Limpar forno e micro-ondas',30,'cozinha','biweekly'],['Lavar as lixeiras',25,'limpeza','biweekly'],['Lavar toalhas e panos de prato',25,'lavanderia','biweekly'],['Organizar a despensa',30,'organizacao','biweekly'],['Limpar as janelas',35,'limpeza','biweekly'],['Banho nos pets',40,'animais','biweekly'],['Limpar atrás e embaixo dos móveis',45,'sala','biweekly'],['Limpar a geladeira',60,'cozinha','monthly'],['Limpeza geral da casa',100,'limpeza','monthly'],['Organizar um armário',50,'organizacao','monthly'],['Lavar cortinas e tapetes',80,'lavanderia','monthly'],['Lavar cobertores e edredom',70,'lavanderia','monthly'],['Limpar o ar-condicionado ou ventilador',50,'limpeza','monthly'],['Faxina da varanda ou quintal',70,'outras','monthly'],['Limpar ralos e filtros',50,'limpeza','monthly'],['Descongelar e limpar o freezer',60,'cozinha','monthly'],['Limpar o armário da cozinha por dentro',55,'cozinha','monthly']];
const IMG_AV={'img:menino':'Pequeno Rei','img:rainha':'Rainha','img:oculos':'Rei de Óculos'};
const isImg=a=>String(a).startsWith('img:');
const AVATARS=[...Object.keys(IMG_AV),'🦊','🐙','🐸','🦉','🐼','🐯','🐱','🦄','🐻','🐧','🦖','🐳'];
const COLORS=['#2B63E8','#F2761F','#8B5CF6','#17A06A','#EC4899','#0EA5A4'];
const DEFAULT_CHALLENGES=['Arrume 5 coisas fora do lugar em 5 minutos','Deixe a pia da cozinha vazia hoje','Limpe uma superfície que ninguém lembra de limpar','Organize uma gaveta','Passe um pano na porta da geladeira','Recolha tudo o que está fora do lugar na sala'];
const STAT={available:'Disponível',in_progress:'Em andamento',awaiting_proof:'Aguardando comprovação',awaiting_approval:'Aguardando aprovação',done:'Concluída',rejected:'Rejeitada',late:'Atrasada',cancelled:'Cancelada'};
const FREQ={once:'Única',daily:'Diária',days:'Dias da semana',weekly:'Semanal',biweekly:'Quinzenal',monthly:'Mensal',custom:'Personalizada'};
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const nextWd=(s,wd)=>{let d=s,g=0;while(g++<8&&!wd.includes(pd(d).getDay()))d=addDays(d,1);return d};
const cleanWd=a=>[...new Set((a||[]).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))].sort();
const gameStarted=()=>!S.settings.gameStart||today()>=S.settings.gameStart;
const frLabel=d=>d.frequency==='days'?(d.weekdays||[]).map(i=>WD[i]).join(', '):d.frequency==='custom'&&d.interval===14?'Quinzenal':FREQ[d.frequency]+(d.frequency==='custom'?' ('+d.interval+' dias)':'');
const PICK_G=[['daily','Diárias'],['weekly','Semanais'],['biweekly','Quinzenais'],['monthly','Mensais']];
const ACH=[
 {id:'first',name:'Primeira Missão',icon:'🚀',desc:'Ter a primeira tarefa aprovada.',coins:5,p:s=>[s.n,1]},
 {id:'ten',name:'Casa em Movimento',icon:'🏃',desc:'Ter dez tarefas aprovadas.',coins:10,p:s=>[s.n,10]},
 {id:'days3',name:'Consistência',icon:'📆',desc:'Ter tarefas aprovadas em três dias diferentes.',coins:5,p:s=>[s.days,3]},
 {id:'kitchen',name:'Mestre da Cozinha',icon:'👨‍🍳',desc:'Dez tarefas aprovadas na categoria Cozinha.',coins:10,p:s=>[s.byCat.cozinha||0,10]},
 {id:'bath',name:'Banheiro Impecável',icon:'🛁',desc:'Cinco tarefas aprovadas na categoria Banheiro.',coins:10,p:s=>[s.byCat.banheiro||0,5]},
 {id:'clean',name:'Sem Pendências',icon:'🧘',desc:'Ter ao menos uma tarefa aprovada e nenhuma atrasada atribuída a você.',coins:5,p:s=>[s.n>=1&&s.late===0?1:0,1]},
 {id:'week',name:'Semana Produtiva',icon:'⚡',desc:'Cinco tarefas aprovadas dentro de 7 dias.',coins:10,p:s=>[s.bestWeek,5]},
 {id:'champ',name:'Campeão do Mês',icon:'🏆',desc:'Vencer uma competição mensal.',coins:20,p:s=>[s.wins,1]},
 {id:'back',name:'Retorno Triunfal',icon:'🔥',desc:'Voltar a ter tarefa aprovada depois de 7 dias ou mais sem nenhuma.',coins:5,p:s=>[s.comeback?1:0,1]}
];
const REWARDS0=[['Escolher o filme da noite','Você escolhe o filme.',30,'normal'],['Escolher o jantar','Você escolhe o que será o jantar.',40,'normal'],['Uma hora livre de uma tarefa','Combine com o grupo qual tarefa.',60,'normal'],['Escolher a próxima playlist','A casa ouve a sua playlist.',15,'normal'],['Favor doméstico acordado','Um pequeno favor combinado de antemão.',70,'normal']];

function seed(){
  const t=nowIso();
  const mk=(n,a,c,r)=>({id:uid('u'),name:n,avatar:a,color:c,role:r,active:true,email:null,pinHash:null,salt:null,avatars:[],title:'',createdAt:t});
  const users=[Object.assign(mk('Administrador','🛡️',COLORS[0],'admin'),{plays:false})];
  return {v:1,setupDone:false,
    settings:{appName:'Rei da Faxina',openSignup:true,prize:50,restDays:2,shop:true,coinRate:1,startDate:today(),gameStart:'2026-11-01',
      penalty:{enabled:false,latePoints:0,missPoints:0,maxPerOcc:5,grace:1},challenges:DEFAULT_CHALLENGES.slice()},
    users,categories:CATS.map(c=>({id:c[0],name:c[1],icon:c[2]})),
    catalog:CATALOG.map((c,i)=>({id:'m'+i,title:c[0],points:c[1],categoryId:c[2],freq:c[3]})),
    tasks:[],occurrences:[],evidences:[],scoreTx:[],periods:[],unlocked:[],walletTx:[],
    rewards:REWARDS0.map(r=>({id:uid('r'),name:r[0],desc:r[1],cost:r[2],kind:r[3],stock:null,active:true,limit:0})).concat([
      {id:uid('r'),name:'Avatar especial 🦁',desc:'Libera o avatar 🦁 para você.',cost:100,kind:'avatar',emoji:'🦁',stock:null,active:true,limit:1},
      {id:uid('r'),name:'Título Mestre do Rodo',desc:'Mostra o título ao lado do seu nome.',cost:80,kind:'title',title:'Mestre do Rodo',stock:null,active:true,limit:1}]),
    redemptions:[],restDays:[],spins:[],audit:[],pets:{}};
}

/* ===== estado ===== */
let S=REMOTE?remoteSkeleton():(Adapter.load()||seed());if(!S.pets)S.pets={};
let listeners=[];const onChange=f=>listeners.push(f);
let celebrations=[];
function commit(){Adapter.save(S);listeners.forEach(f=>f())}
const ok=(x={})=>Object.assign({ok:true},x),fail=e=>({ok:false,err:e});

/* ===== seletores ===== */
const user=id=>S.users.find(u=>u.id===id);
const plays=u=>!!u&&u.plays!==false;
const actives=()=>S.users.filter(u=>u.active&&u.plays!==false);
const openPeriod=()=>S.periods.find(p=>p.status==='open')||null;
const period=id=>S.periods.find(p=>p.id===id);
const cat=id=>S.categories.find(c=>c.id===id)||{id:'outras',name:'Outras',icon:'✨'};
const occ=id=>S.occurrences.find(o=>o.id===id);
const isAdmin=id=>{const u=user(id);return !!u&&u.active&&u.role==='admin'};
const effStatus=o=>((o.status==='available'||o.status==='in_progress')&&o.dueDate&&o.dueDate<today())?'late':o.status;
const OPEN_ST=['available','in_progress','rejected'];
const taskTx=(u,p)=>S.scoreTx.filter(t=>t.type==='task'&&!t.reversedBy&&(!u||t.userId===u)&&(!p||t.periodId===p));
const score=(u,p)=>S.scoreTx.filter(t=>t.userId===u&&(!p||t.periodId===p)).reduce((a,t)=>a+t.points,0);
const balance=u=>S.walletTx.filter(t=>t.userId===u).reduce((a,t)=>a+t.amount,0);
function standings(pid){
  const ids=new Set(S.users.filter(u=>u.active&&u.plays!==false).map(u=>u.id));
  S.scoreTx.filter(t=>t.periodId===pid).forEach(t=>ids.add(t.userId));
  const rows=[...ids].map(id=>{const tx=taskTx(id,pid);return {user:user(id),id,pts:score(id,pid),tasks:tx.length,rec:tx.filter(t=>{const o=occ(t.occId);return o&&o.recurring}).reduce((a,t)=>a+t.points,0)}});
  rows.sort((a,b)=>b.pts-a.pts||b.tasks-a.tasks||b.rec-a.rec);
  rows.forEach((r,i)=>{const p=rows[i-1];r.pos=p&&p.pts===r.pts&&p.tasks===r.tasks&&p.rec===r.rec?p.pos:i+1});
  rows.forEach(r=>r.tied=rows.filter(x=>x.pos===r.pos).length>1);
  return rows;
}
function ustats(uid){
  const tx=taskTx(uid),days=new Set(),byCat={};
  tx.forEach(t=>{days.add(t.day);const o=occ(t.occId);const c=o?o.categoryId:'outras';byCat[c]=(byCat[c]||0)+1});
  const sorted=[...days].sort();let best=0;
  const all=tx.map(t=>t.day).sort();
  for(let i=0;i<all.length;i++){let j=i;while(j<all.length&&diffDays(all[i],all[j])<7)j++;best=Math.max(best,j-i)}
  let comeback=false;for(let i=1;i<sorted.length;i++)if(diffDays(sorted[i-1],sorted[i])>=7)comeback=true;
  const late=S.occurrences.filter(o=>o.assignedTo===uid&&effStatus(o)==='late').length;
  const wins=S.periods.filter(p=>p.status==='closed'&&p.winnerId===uid).length;
  return {n:tx.length,days:days.size,byCat,bestWeek:best,comeback,late,wins,dayList:sorted};
}
function streak(uid){
  const set=new Set(ustats(uid).dayList);let d=today();if(!set.has(d))d=addDays(d,-1);
  let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n;
}
const achOf=(a,uid)=>{const [c,m]=a.p(ustats(uid));return {cur:Math.min(c,m),max:m,done:c>=m}};
const isUnlocked=(u,a)=>S.unlocked.find(x=>x.userId===u&&x.achId===a);

/* ===== auditoria e utilitários de ação ===== */
function audit(actorId,action,entity,entityId,reason){S.audit.unshift({id:uid('au'),actorId,action,entity,entityId,reason:reason||'',at:nowIso()});if(S.audit.length>3000)S.audit.length=3000}
function actor(id,admin){const u=user(id);if(!u||!u.active)return null;if(admin&&u.role!=='admin')return null;return u}
const NOAUTH=fail('Você não tem permissão para esta ação.');
function wallet(userId,type,amount,ref,reason){S.walletTx.push({id:uid('w'),userId,type,amount,ref:ref||null,reason:reason||'',createdAt:nowIso()})}
function addTx(userId,type,points,occId,reason,by,extra){
  const p=openPeriod();const t=Object.assign({id:uid('s'),userId,occId:occId||null,periodId:p.id,type,points,reason:reason||'',createdAt:nowIso(),day:today(),createdBy:by},extra||{});
  S.scoreTx.push(t);return t;
}
function checkAch(uid){
  ACH.forEach(a=>{
    if(isUnlocked(uid,a.id))return;const r=achOf(a,uid);
    if(r.done){S.unlocked.push({id:uid_('ua'),userId:uid,achId:a.id,at:nowIso()});
      if(a.coins)wallet(uid,'bonus',a.coins,a.id,'Conquista: '+a.name);
      audit('system','achievement','user',uid,a.name);celebrations.push({type:'ach',userId:uid,ach:a})}
  });
}
const uid_=uid;

/* ===== recorrência ===== */
function mkOcc(def,due){
  const p=openPeriod();
  return {id:uid('o'),taskId:def.id,title:def.title,desc:def.desc||'',categoryId:def.categoryId,points:def.points,assignedTo:def.assignedTo||null,periodId:p.id,
    dueDate:due,status:'available',recurring:def.frequency!=='once',createdAt:nowIso(),completedAt:null,submittedBy:null,submittedAt:null,reviewedBy:null,reviewedAt:null,rejectionReason:'',photoId:null,log:[{at:nowIso(),by:'system',text:'Criada'}]};
}
function genOccurrences(){
  const t=today();let n=0;if(!gameStarted())return 0;
  S.tasks.forEach(d=>{
    if(!d.active||d.frequency==='once'||!d.nextDue)return;
    if(d.nextDue>t)return;
    let due=d.nextDue,last=null,guard=0;
    const adv=x=>d.frequency==='days'?nextWd(addDays(x,1),d.weekdays||[0,1,2,3,4,5,6]):d.frequency==='daily'?addDays(x,1):d.frequency==='weekly'?addDays(x,7):d.frequency==='monthly'?addMonth(x,d.anchorDay):addDays(x,d.interval||1);
    while(due<=t&&guard++<800){last=due;due=adv(due)}
    if(last&&!S.occurrences.some(o=>o.taskId===d.id&&o.dueDate===last)){S.occurrences.push(mkOcc(d,last));n++}
    d.nextDue=due;
  });
  return n;
}
function pen(o,kind,pts){
  const p=S.settings.penalty;const already=S.scoreTx.filter(t=>t.occId===o.id&&t.type==='penalty'&&!t.reversedBy).reduce((a,t)=>a-t.points,0);
  const room=Math.max(0,p.maxPerOcc-already);const cur=score(o.assignedTo,openPeriod().id);
  const amt=Math.min(pts,room,Math.max(0,cur));
  o[kind]=true;
  if(amt>0){addTx(o.assignedTo,'penalty',-amt,o.id,(kind==='latePen'?'Atraso: ':'Não executada no prazo: ')+o.title,'system');return true}
  return false;
}
function sweep(){
  const p=openPeriod();if(!p)return;let ch=genOccurrences()>0;const t=today(),cfg=S.settings.penalty;
  if(cfg.enabled)S.occurrences.forEach(o=>{
    if(o.periodId!==p.id||!o.assignedTo||!o.dueDate||!OPEN_ST.includes(o.status)||o.dueDate>=t)return;
    if(!o.latePen&&cfg.latePoints>0){pen(o,'latePen',cfg.latePoints);ch=true}
    if(!o.missPen&&cfg.missPoints>0&&t>addDays(o.dueDate,cfg.grace)){pen(o,'missPen',cfg.missPoints);ch=true}
  });
  if(ch)commit();
}

/* ===== ações (todas validam o ator; no Supabase viram funções RPC com RLS) ===== */
const A={};
const POINTS_OK=n=>Number.isInteger(n)&&n>0&&n<=500;
function validTaskData(d,isNew){
  const title=String(d.title||'').trim();
  if(title.length<2||title.length>80)return 'Informe um nome com 2 a 80 caracteres.';
  if(!POINTS_OK(d.points))return 'A pontuação deve ser um número inteiro de 1 a 500.';
  if(!S.categories.some(c=>c.id===d.categoryId))return 'Categoria inválida.';
  if(!FREQ[d.frequency])return 'Frequência inválida.';
  if(d.frequency==='custom'&&!(Number.isInteger(d.interval)&&d.interval>=2&&d.interval<=365))return 'Informe o intervalo em dias (2 a 365).';
  if(d.frequency==='days'&&!cleanWd(d.weekdays).length)return 'Escolha pelo menos um dia da semana.';
  if(!validDate(d.dueDate))return 'Informe um prazo válido.';
  if(isNew&&d.dueDate<today())return 'O prazo não pode estar no passado.';
  if(d.assignedTo&&!actor(d.assignedTo))return 'Responsável inexistente ou inativo.';
  return null;
}
A.createTask=(by,d)=>{
  if(!actor(by,true))return NOAUTH;const e=validTaskData(d,true);if(e)return fail(e);
  const title=d.title.trim();
  if(S.occurrences.some(o=>normT(o.title)===normT(title)&&o.dueDate===d.dueDate&&o.status!=='cancelled'))return fail('Já existe uma tarefa com esse nome e esse prazo.');
  const def={id:uid('t'),title,desc:(d.desc||'').trim().slice(0,300),categoryId:d.categoryId,frequency:d.frequency,interval:d.interval||null,weekdays:d.frequency==='days'?cleanWd(d.weekdays):null,points:d.points,assignedTo:d.assignedTo||null,
    nextDue:d.frequency==='days'?nextWd(d.dueDate,cleanWd(d.weekdays)):d.dueDate,anchorDay:+d.dueDate.slice(8),active:true,createdAt:nowIso(),updatedAt:nowIso(),log:[{at:nowIso(),by,text:'Criada'}]};
  S.tasks.push(def);
  if(def.frequency==='once'){S.occurrences.push(mkOcc(def,d.dueDate));def.nextDue=null;def.active=false}
  else genOccurrences();
  audit(by,'create','task',def.id,title);commit();return ok({id:def.id});
};
A.updateDef=(by,id,d)=>{
  if(!actor(by,true))return NOAUTH;const def=S.tasks.find(x=>x.id===id);if(!def)return fail('Tarefa não encontrada.');
  const nd=Object.assign({},def,d,{dueDate:d.nextDue||def.nextDue||today()});const e=validTaskData(nd,false);if(e)return fail(e);
  Object.assign(def,{title:nd.title.trim(),desc:(nd.desc||'').trim().slice(0,300),categoryId:nd.categoryId,points:nd.points,assignedTo:nd.assignedTo||null,frequency:nd.frequency,interval:nd.interval||null,weekdays:nd.frequency==='days'?cleanWd(nd.weekdays):null,active:!!nd.active,updatedAt:nowIso()});
  if(def.frequency==='days'&&def.nextDue)def.nextDue=nextWd(def.nextDue,def.weekdays);
  def.log.push({at:nowIso(),by,text:'Editada'});audit(by,'update','task',id,'');commit();return ok();
};
A.deleteDef=(by,id)=>{
  if(!actor(by,true))return NOAUTH;const i=S.tasks.findIndex(x=>x.id===id);if(i<0)return fail('Tarefa não encontrada.');
  if(S.occurrences.some(o=>o.taskId===id)){S.tasks[i].active=false;audit(by,'deactivate','task',id,'');commit();return ok({deactivated:true})}
  S.tasks.splice(i,1);audit(by,'delete','task',id,'');commit();return ok();
};
A.updateOcc=(by,id,d)=>{
  if(!actor(by,true))return NOAUTH;const o=occ(id);if(!o)return fail('Tarefa não encontrada.');
  if(!OPEN_ST.includes(o.status))return fail('Só é possível editar tarefas ainda não enviadas.');
  if(!POINTS_OK(d.points))return fail('A pontuação deve ser um número inteiro de 1 a 500.');
  if(!validDate(d.dueDate))return fail('Informe um prazo válido.');
  if(d.assignedTo&&!actor(d.assignedTo))return fail('Responsável inexistente ou inativo.');
  const ch=[];if(o.points!==d.points)ch.push('pontos '+o.points+'→'+d.points);if(o.dueDate!==d.dueDate)ch.push('prazo '+brDate(o.dueDate)+'→'+brDate(d.dueDate));if((o.assignedTo||null)!==(d.assignedTo||null))ch.push('responsável alterado');
  o.points=d.points;o.dueDate=d.dueDate;o.assignedTo=d.assignedTo||null;if(d.desc!=null)o.desc=String(d.desc).slice(0,300);
  if(o.status==='rejected'&&false)o.status='available';
  if(ch.length){o.log.push({at:nowIso(),by,text:'Editada: '+ch.join(', ')});audit(by,'update','occurrence',id,ch.join(', '))}
  commit();return ok();
};
A.cancelOcc=(by,id,reason)=>{
  if(!actor(by,true))return NOAUTH;const o=occ(id);if(!o)return fail('Tarefa não encontrada.');
  if(!OPEN_ST.includes(o.status)&&o.status!=='awaiting_approval')return fail('Esta tarefa não pode ser cancelada.');
  o.status='cancelled';o.log.push({at:nowIso(),by,text:'Cancelada'+(reason?': '+reason:'')});audit(by,'cancel','occurrence',id,reason||'');commit();return ok();
};
A.claim=(by,id)=>{
  const u=actor(by);if(!u)return NOAUTH;const o=occ(id);if(!o)return fail('Tarefa não encontrada.');
  if(o.assignedTo)return fail('Esta tarefa já tem responsável.');if(!OPEN_ST.includes(o.status))return fail('Esta tarefa não está disponível.');
  o.assignedTo=by;o.log.push({at:nowIso(),by,text:'Assumida por '+u.name});audit(by,'claim','occurrence',id,'');commit();return ok();
};
A.assign=(by,id,to)=>{
  if(!actor(by,true))return NOAUTH;const o=occ(id);if(!o)return fail('Tarefa não encontrada.');if(!actor(to))return fail('Participante inexistente ou inativo.');
  if(!OPEN_ST.includes(o.status))return fail('Esta tarefa não pode ser reatribuída agora.');
  o.assignedTo=to;o.log.push({at:nowIso(),by,text:'Atribuída a '+user(to).name});audit(by,'assign','occurrence',id,user(to).name);commit();return ok();
};
A.start=(by,id)=>{
  const o=occ(id);if(!o||o.assignedTo!==by||!actor(by))return NOAUTH;if(o.status!=='available')return fail('Esta tarefa já foi iniciada.');
  o.status='in_progress';o.log.push({at:nowIso(),by,text:'Iniciada'});commit();return ok();
};
const IMG_RE=/^data:image\/(jpeg|png|webp);base64,/;
A.submit=async(by,id,photo)=>{
  const u=actor(by);if(!u)return NOAUTH;let o=occ(id);if(!o)return fail('Tarefa não encontrada.');
  if(o.assignedTo!==by)return fail('Só o responsável pode enviar a comprovação.');
  if(!['available','in_progress','rejected'].includes(o.status))return fail('Esta tarefa não aceita novo envio agora.');
  const p=openPeriod();if(!p||o.periodId!==p.id)return fail('O período desta tarefa foi encerrado.');
  if(typeof photo!=='string'||!IMG_RE.test(photo))return fail('Envie uma foto JPEG, PNG ou WebP.');
  if(photo.length>2.2e6)return fail('A foto é grande demais.');
  o.status='awaiting_approval';// reserva o estado antes de qualquer await, bloqueia duplo clique
  const pid=uid('ph');
  try{await Adapter.putPhoto(pid,photo)}catch(e){}
  o.photoId=pid;o.submittedBy=by;o.submittedAt=nowIso();o.rejectionReason='';
  S.evidences.push({id:uid('e'),occId:id,submittedBy:by,photoId:pid,submittedAt:nowIso(),reviewStatus:'pending',reviewedBy:null,reviewedAt:null,rejectionReason:''});
  o.log.push({at:nowIso(),by,text:'Comprovação enviada'});audit(by,'submit','occurrence',id,'');commit();return ok();
};
A.review=(by,id,approve,reason)=>{
  const u=actor(by);if(!u)return NOAUTH;const o=occ(id);if(!o)return fail('Tarefa não encontrada.');
  if(o.status!=='awaiting_approval')return fail('Esta tarefa não está aguardando aprovação.');
  if(o.submittedBy===by||o.assignedTo===by)return fail('Você não pode aprovar a sua própria tarefa.');
  const ev=[...S.evidences].reverse().find(e=>e.occId===id&&e.reviewStatus==='pending');
  if(!approve){
    const r=String(reason||'').trim();if(r.length<3)return fail('Informe o motivo da rejeição.');
    o.status='rejected';o.rejectionReason=r;o.reviewedBy=by;o.reviewedAt=nowIso();if(ev)Object.assign(ev,{reviewStatus:'rejected',reviewedBy:by,reviewedAt:nowIso(),rejectionReason:r});
    o.log.push({at:nowIso(),by,text:'Rejeitada: '+r});audit(by,'reject','occurrence',id,r);commit();return ok();
  }
  const p=openPeriod();if(!p||o.periodId!==p.id)return fail('O período desta tarefa foi encerrado.');
  if(S.scoreTx.some(t=>t.occId===id&&t.type==='task'))return fail('Os pontos desta tarefa já foram creditados.');
  if(!o.assignedTo)return fail('Tarefa sem responsável não gera pontos.');
  o.status='done';o.completedAt=nowIso();o.reviewedBy=by;o.reviewedAt=nowIso();
  if(ev)Object.assign(ev,{reviewStatus:'approved',reviewedBy:by,reviewedAt:nowIso()});
  addTx(o.assignedTo,'task',o.points,id,o.title,by);
  const coins=Math.floor(o.points*(S.settings.coinRate||0));if(coins>0)wallet(o.assignedTo,'earn',coins,id,'Tarefa: '+o.title);
  o.log.push({at:nowIso(),by,text:'Aprovada, +'+o.points+' pontos'});audit(by,'approve','occurrence',id,'');
  checkAch(o.assignedTo);commit();return ok({points:o.points});
};
A.adjust=(by,userId,delta,reason,periodId)=>{
  if(!actor(by,true))return NOAUTH;if(!user(userId))return fail('Participante inexistente.');
  if(!Number.isInteger(delta)||delta===0||Math.abs(delta)>500)return fail('Informe um ajuste inteiro diferente de zero (até 500).');
  const r=String(reason||'').trim();if(r.length<3)return fail('A justificativa é obrigatória.');
  const p=period(periodId||openPeriod().id);if(!p)return fail('Período inexistente.');
  const t={id:uid('s'),userId,occId:null,periodId:p.id,type:'adjust',points:delta,reason:r,createdAt:nowIso(),day:today(),createdBy:by,postClose:p.status==='closed'};
  S.scoreTx.push(t);audit(by,p.status==='closed'?'adjust_closed':'adjust','scoreTx',t.id,r);commit();return ok();
};
A.reverse=(by,txId,reason)=>{
  if(!actor(by,true))return NOAUTH;const t=S.scoreTx.find(x=>x.id===txId);if(!t)return fail('Registro não encontrado.');
  if(t.type==='reversal'||t.reversedBy)return fail('Este registro já foi estornado ou é um estorno.');
  const r=String(reason||'').trim();if(r.length<3)return fail('A justificativa é obrigatória.');
  const p=period(t.periodId);
  const rv={id:uid('s'),userId:t.userId,occId:t.occId,periodId:t.periodId,type:'reversal',points:-t.points,reason:r,refTx:t.id,createdAt:nowIso(),day:today(),createdBy:by,postClose:p.status==='closed'};
  S.scoreTx.push(rv);t.reversedBy=rv.id;
  if(t.type==='task'){const e=S.walletTx.filter(w=>w.type==='earn'&&w.ref===t.occId&&w.userId===t.userId).reduce((a,w)=>a+w.amount,0);
    const back=Math.min(e,Math.max(0,balance(t.userId)));if(back>0)wallet(t.userId,'reversal',-back,t.occId,'Estorno: '+r);
    const o=occ(t.occId);if(o)o.log.push({at:nowIso(),by,text:'Pontos estornados: '+r})}
  audit(by,p.status==='closed'?'reverse_closed':'reverse','scoreTx',t.id,r);commit();return ok();
};
A.contest=(by,txId,text)=>{
  const t=S.scoreTx.find(x=>x.id===txId);if(!t||t.type!=='penalty'||t.userId!==by||!actor(by))return NOAUTH;
  if(t.contest)return fail('Esta penalidade já foi contestada.');const x=String(text||'').trim();if(x.length<3)return fail('Explique o motivo da contestação.');
  t.contest={text:x,at:nowIso(),status:'open'};audit(by,'contest','scoreTx',txId,x);commit();return ok();
};
A.resolveContest=(by,txId,accept,reason)=>{
  if(!actor(by,true))return NOAUTH;const t=S.scoreTx.find(x=>x.id===txId);if(!t||!t.contest||t.contest.status!=='open')return fail('Contestação não encontrada.');
  const r=String(reason||'').trim();if(r.length<3)return fail('Informe a justificativa da decisão.');
  if(accept){const x=A.reverse(by,txId,'Contestação aceita: '+r);if(!x.ok)return x}
  t.contest.status=accept?'accepted':'denied';t.contest.reply=r;t.contest.by=by;audit(by,'resolve_contest','scoreTx',txId,r);commit();return ok();
};
A.closePeriod=(by,opt)=>{
  if(!actor(by,true))return NOAUTH;const p=openPeriod();if(!p)return fail('Nenhum período aberto.');opt=opt||{};
  if(S.occurrences.some(o=>o.periodId===p.id&&o.status==='awaiting_approval'))return fail('Resolva as aprovações pendentes antes de encerrar o período.');
  const st=standings(p.id);const top=st[0];let winner=null,tie=null;
  if(top&&top.pts>0){
    const g=st.filter(r=>r.pos===1);
    if(g.length>1){
      if(opt.winnerId&&g.some(r=>r.id===opt.winnerId)){const n=String(opt.tieNote||'').trim();if(n.length<3)return fail('Registre como o empate foi decidido.');winner=opt.winnerId;tie={users:g.map(r=>r.id),note:n,by}}
      else return ok({tie:g.map(r=>r.id)});
    }else winner=g[0].id;
  }
  const t=today();p.status='closed';p.end=p.end<t?p.end:t;p.winnerId=winner;p.tieResolution=tie;p.prizeAmount=winner?S.settings.prize:0;p.prizePaid=false;p.closedAt=nowIso();p.closedBy=by;
  p.final=st.map(r=>({userId:r.id,pts:r.pts,tasks:r.tasks,pos:r.pos}));
  if(winner)for(let i=0;i<(S.settings.restDays||0);i++)S.restDays.push({id:uid('rd'),userId:winner,periodId:p.id,date:null,status:'pending'});
  const ns=addDays(p.end,1),np={id:'p-'+ns,start:ns,end:monthEnd(ns),status:'open',winnerId:null,prizeAmount:0,tieResolution:null};
  S.periods.push(np);
  S.occurrences.forEach(o=>{if(o.periodId===p.id&&OPEN_ST.includes(o.status)){o.periodId=np.id;o.log.push({at:nowIso(),by:'system',text:'Transferida para '+periodLabel(np)})}});
  audit(by,'close_period','period',p.id,winner?'Vencedor: '+user(winner).name:'Sem vencedor');
  if(winner)checkAch(winner);
  celebrations.push({type:'winner',periodId:p.id});
  genOccurrences();commit();return ok({winner,periodId:p.id});
};
A.rest=(by,id,date,status)=>{
  if(!actor(by,true))return NOAUTH;const r=S.restDays.find(x=>x.id===id);if(!r)return fail('Registro não encontrado.');
  if(!['pending','scheduled','used'].includes(status))return fail('Status inválido.');
  if(status!=='pending'&&!validDate(date))return fail('Informe a data do descanso.');
  r.date=status==='pending'?null:date;r.status=status;audit(by,'rest','restDay',id,status+' '+(date||''));commit();return ok();
};
A.prizePaid=(by,pid,paid)=>{if(!actor(by,true))return NOAUTH;const p=period(pid);if(!p||p.status!=='closed')return fail('Período inválido.');p.prizePaid=!!paid;audit(by,'prize','period',pid,paid?'pago':'pendente');commit();return ok()};
A.tieBreakInfo=()=>standings(openPeriod().id).filter(r=>r.pos===1);
/* loja */
A.redeem=(by,rid,reqId)=>{
  const u=actor(by);if(!u)return NOAUTH;if(!S.settings.shop)return fail('A loja está desativada.');
  if(reqId&&S.redemptions.some(r=>r.reqId===reqId))return fail('Este resgate já foi processado.');
  const r=S.rewards.find(x=>x.id===rid);if(!r||!r.active)return fail('Recompensa indisponível.');
  if(r.stock!=null&&r.stock<=0)return fail('Recompensa esgotada.');
  const p=openPeriod();
  if(r.limit>0){const n=S.redemptions.filter(x=>x.rewardId===rid&&x.userId===by&&x.status!=='cancelled'&&(r.kind==='normal'?x.periodId===p.id:true)).length;if(n>=r.limit)return fail('Você atingiu o limite desta recompensa.')}
  if(r.kind==='avatar'&&u.avatars.includes(r.emoji))return fail('Você já tem este avatar.');
  if(balance(by)<r.cost)return fail('Saldo de moedas insuficiente.');
  const red={id:uid('rd'),reqId:reqId||uid('rq'),rewardId:rid,name:r.name,userId:by,cost:r.cost,status:'pending',periodId:p.id,createdAt:nowIso(),refunded:false};
  wallet(by,'spend',-r.cost,red.id,'Resgate: '+r.name);
  if(r.stock!=null)r.stock--;
  if(r.kind==='avatar'){u.avatars.push(r.emoji);red.status='done'}
  if(r.kind==='title'){u.title=r.title;red.status='done'}
  S.redemptions.push(red);audit(by,'redeem','redemption',red.id,r.name);commit();return ok({id:red.id});
};
A.redemption=(by,id,action)=>{
  const u=actor(by);if(!u)return NOAUTH;const r=S.redemptions.find(x=>x.id===id);if(!r)return fail('Resgate não encontrado.');
  if(action==='approve'){if(r.status!=='pending')return fail('Este resgate não está pendente.');if(r.userId===by)return fail('Outra pessoa precisa aprovar o seu resgate.');r.status='approved'}
  else if(action==='done'){if(r.status!=='approved'&&r.status!=='pending')return fail('Este resgate não pode ser concluído.');if(r.userId!==by&&u.role!=='admin')return NOAUTH;if(r.status==='pending'&&r.userId!==by&&u.role==='admin'&&false)return NOAUTH;r.status='done'}
  else if(action==='cancel'){
    if(r.status==='done'||r.status==='cancelled')return fail('Este resgate não pode ser cancelado.');if(r.userId!==by&&u.role!=='admin')return NOAUTH;
    r.status='cancelled';if(!r.refunded){r.refunded=true;wallet(r.userId,'refund',r.cost,r.id,'Estorno: '+r.name);const rw=S.rewards.find(x=>x.id===r.rewardId);if(rw&&rw.stock!=null)rw.stock++}
  }else return fail('Ação inválida.');
  audit(by,'redemption_'+action,'redemption',id,'');commit();return ok();
};
A.saveReward=(by,d)=>{

const normE=e=>String(e||'').trim().toLowerCase();
const EMAIL_OK=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const Auth={fails:{},
  async hash(pin,salt){const s=salt+':'+pin;try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h.toString(16)},
  valid:p=>typeof p==='string'&&p.length>=6&&p.length<=72,
  byEmail:e=>{e=normE(e);return S.users.find(u=>u.active&&u.email&&normE(u.email)===e)},
  async force(userId,pw){const u=user(userId);u.salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(x=>x.toString(16).padStart(2,'0')).join('');u.pinHash=await Auth.hash(pw,u.salt)},
  async setPin(userId,pw,current){
    const u=user(userId);if(!u||!u.active)return fail('Participante inexistente.');if(!Auth.valid(pw))return fail('A senha deve ter pelo menos 6 caracteres.');
    if(u.pinHash){if(!(await Auth.check(userId,current||'')).ok)return fail('Senha atual incorreta.')}
    await Auth.force(userId,pw);audit(userId,'password','user',userId,'');commit();return ok();
  },
  async check(userId,pw){
    const bad='E-mail ou senha incorretos.';
    const u=user(userId);if(!u||!u.active||!u.pinHash)return fail(bad);
    const f=Auth.fails[userId]||(Auth.fails[userId]={n:0,until:0});if(Date.now()<f.until)return fail('Muitas tentativas. Aguarde '+Math.ceil((f.until-Date.now())/1000)+'s.');
    if(await Auth.hash(pw,u.salt)===u.pinHash){f.n=0;return ok()}
    f.n++;if(f.n>=5){f.n=0;f.until=Date.now()+30000;return fail('Senha incorreta. Acesso bloqueado por 30s.')}return fail(bad);
  },
  async adminSet(by,userId,pw){if(!actor(by,true))return NOAUTH;const u=user(userId);if(!u)return fail('Participante inexistente.');if(!Auth.valid(pw))return fail('A senha deve ter pelo menos 6 caracteres.');await Auth.force(userId,pw);audit(by,'reset_password','user',userId,'');commit();return ok()}
};

function verifyIntegrity(st){
  const p=[];const ids=new Set(st.users.map(u=>u.id));
  st.scoreTx.forEach(t=>{if(!ids.has(t.userId))p.push('Pontuação de participante inexistente: '+t.id);if(!st.periods.some(x=>x.id===t.periodId))p.push('Pontuação em período inexistente: '+t.id)});
  const seen=new Set();st.scoreTx.filter(t=>t.type==='task').forEach(t=>{if(seen.has(t.occId))p.push('Pontos duplicados na tarefa '+t.occId);seen.add(t.occId)});
  st.occurrences.forEach(o=>{if(o.assignedTo&&!ids.has(o.assignedTo))p.push('Tarefa com responsável inexistente: '+o.id);if(o.status==='done'&&!st.scoreTx.some(t=>t.occId===o.id&&t.type==='task'))p.push('Tarefa concluída sem pontuação: '+o.id)});
  st.walletTx.forEach(w=>{if(!ids.has(w.userId))p.push('Moedas de participante inexistente: '+w.id)});
  st.users.forEach(u=>{const b=st.walletTx.filter(w=>w.userId===u.id).reduce((a,w)=>a+w.amount,0);if(b<0)p.push('Saldo negativo: '+u.name)});
  if(st.periods.filter(x=>x.status==='open').length!==1)p.push('Deve existir exatamente um período aberto.');
  return p;
}

  let mx=5,mn=0;series.forEach(s=>s.pts.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v)}));mx=Math.ceil(mx/5)*5;if(mn<0)mn=Math.floor(mn/5)*5;
  const X=i=>n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);

  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{g+='<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" style="fill:var(--muted)">'+brShort(addDays(p.start,i))+'</text>'});
  g+='<text x="'+(L+(W-L-R)/2)+'" y="'+(H-1)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">Dia do período</text>';
  series.forEach((s,k)=>{const d=s.pts.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ');
    g+='<path d="'+d+'" fill="none" stroke="'+esc(s.u.color)+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="'+dash[k%4]+'"/><circle cx="'+X(n-1)+'" cy="'+Y(s.pts[n-1])+'" r="6" fill="'+esc(s.u.color)+'" style="stroke:var(--line)" stroke-width="2.5"/>'});
  const leg=series.map((s,k)=>'<span><svg width="34" height="10" aria-hidden="true"><line x1="2" x2="32" y1="5" y2="5" stroke="'+esc(s.u.color)+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+dash[k%4]+'"/></svg>'+esc(s.u.name)+' ('+s.pts[n-1]+')</span>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Pontos acumulados por dia">'+g+'</svg><div class="legend">'+leg+'</div><p class="sm muted">Pontos acumulados por dia, a partir de '+brDate(p.start)+'. Eixo vertical em pontos.</p>';
}

function filterOccs(){
  const f=UI.filters,q=normT(f.q);
  return S.occurrences.filter(o=>{
    const st=effStatus(o);
    if(f.who!=='all'&&(f.who==='none'?o.assignedTo:o.assignedTo!==f.who))return false;
    if(f.cat!=='all'&&o.categoryId!==f.cat)return false;
    if(f.st==='open'){if(!OPEN_ST.includes(o.status)&&o.status!=='awaiting_approval')return false}
    else if(f.st==='late'){if(st!=='late')return false}

    if(UI.board&&UI.board!=='all'&&freqKey(o)!==UI.board)return false;

/* ===== Roleta ===== */
const WCOL=['--yellow','--blue','--green','--orange','--red'];
function wheelSvg(pool){
  const n=pool.length,seg=360/n;let g='';
  if(n===1)g='<circle r="98" cx="0" cy="0" style="fill:var(--yellow)" stroke-width="3" class="wl"/>';
  pool.forEach((o,i)=>{if(n===1)return;const a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180,R=98;
    g+='<path d="M0 0L'+(R*Math.cos(a0)).toFixed(2)+' '+(R*Math.sin(a0)).toFixed(2)+'A'+R+' '+R+' 0 '+(seg>180?1:0)+' 1 '+(R*Math.cos(a1)).toFixed(2)+' '+(R*Math.sin(a1)).toFixed(2)+'Z" style="fill:var('+WCOL[i%5]+')" class="wl"/>'});
  if(n<=12)pool.forEach((o,i)=>{const mid=(i+.5)*seg-90;const t=(o.icon?AVT(o.icon)+' ':'')+o.label;const flip=Math.cos(mid*Math.PI/180)<0;g+='<text transform="rotate('+(flip?mid+180:mid).toFixed(1)+') translate('+(flip?-30:30)+' 0)" text-anchor="'+(flip?'end':'start')+'" font-size="'+(n>8?5.5:7)+'" font-weight="800" dominant-baseline="middle" style="fill:#1B2340;paint-order:stroke;stroke:#ffffff88;stroke-width:1.2px">'+esc(t.length>(n>8?12:15)?t.slice(0,(n>8?11:14))+'…':t)+'</text>'});
  return '<svg class="wheel" viewBox="-102 -102 204 204" role="img" aria-label="Roleta com '+n+' opções" style="transform:rotate('+UI.spin.rot+'deg)"><g stroke="#1B2340" stroke-width="2.5">'+g+'</g><circle r="9" style="fill:var(--surface)" stroke="#1B2340" stroke-width="3"/></svg>';
}

    const m={task:['task','Tarefa aprovada: '+t.reason],adjust:['adjust','Ajuste manual: '+t.reason],penalty:['penalty','Penalidade: '+t.reason],reversal:['adjust','Estorno: '+t.reason]}[t.type];E.push({at:t.createdAt,userId:t.userId,type:m[0],text:m[1],pts:sg+t.points,cat:tc(t)})});

  S.unlocked.forEach(x=>E.push({at:x.at,userId:x.userId,type:'ach',text:'Conquista: '+ACH.find(a=>a.id===x.achId).name}));
  S.redemptions.forEach(r=>E.push({at:r.createdAt,userId:r.userId,type:'shop',text:'Resgate: '+r.name+' ('+r.cost+' moedas, '+({pending:'pendente',approved:'aprovado',done:'concluído',cancelled:'cancelado'}[r.status])+')'}));

function loadPhoto(file){
  const box=$('#prevbox'),btn=$('#sendbtn');
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Use uma imagem JPEG, PNG ou WebP.','err');return}
  if(file.size>10*1024*1024){toast('A foto passa de 10 MB.','err');return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=960,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);UI.photo=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);
    box.innerHTML='<img class="proof" alt="Pré-visualização da foto" src="'+UI.photo+'"><p class="sm muted">Para trocar, escolha outra foto.</p>';btn.disabled=false};
  img.onerror=()=>{toast('Não foi possível ler essa imagem.','err');URL.revokeObjectURL(url)};img.src=url;
}

   O app só LÊ as tabelas e chama funções (RPC). Quem decide pontos, permissões e regras é o servidor. */
const Remote=REMOTE?(()=>{

  const msg=e=>{
    const m=(e&&e.message)||String(e||'Erro');
    if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
    if(/already registered|already been registered/i.test(m))return 'Este e-mail já tem cadastro. Use "Entrar".';
    if(/Password should be at least|at least 6/i.test(m))return 'A senha precisa ter ao menos 6 caracteres.';
    if(/Email not confirmed/i.test(m))return 'Confirme o seu e-mail pelo link que enviamos e tente de novo.';
    if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
    if(/Database error saving new user/i.test(m))return 'Não foi possível criar o cadastro. Confira o código da casa e tente de novo.';
    if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Sem conexão com o servidor. Verifique a internet.';
    if(/JWT|not authenticated/i.test(m))return 'Sua sessão expirou. Entre de novo.';
    return m;
  };
  const D=x=>x?String(x).slice(0,10):null;
  const lg=l=>(l||[]).map(x=>({at:x.at,by:x.by,text:x.text}));
  const TABLES=['settings','profiles','categories','catalog','periods','tasks','occurrences','evidence','score_tx','wallet_tx','rewards','redemptions','achievements_unlocked','rest_days','spins','audit_log'];
  async function all(t){
    const out=[];
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from(t).select('*').order('id',{ascending:true}).range(from,from+999);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
